[project]
name = "specklegen-ac"
version = "0.1.0"
description = "Generate configurable non-overlapping speckle patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
specklegen-ac = "specklegen_ac.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specklegen_ac"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]